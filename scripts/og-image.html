<!doctype html>
<!--
  Source of public/og.png (1200x630, the image link previews show), drawn like the site: sky, grass and
  dirt over deepslate, and the page panel. Render it with any browser at that window size, e.g.
    chromium --headless --allow-file-access-from-files --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Geist Sans";
				src: url("../node_modules/@fontsource/geist-sans/files/geist-sans-latin-400-normal.woff2")
					format("woff2");
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				position: relative;
				background: #303030 url("../public/decor/deepslate.png") 0 0 / 64px;
				background-blend-mode: multiply;
				image-rendering: pixelated;
				font-family: "Geist Sans", sans-serif;
				color: #202122;
			}
			.sky {
				position: absolute;
				inset: 0 0 auto;
				height: 230px;
				background: linear-gradient(to bottom, #5ea8ef, #a9d4f7);
			}
			.ground {
				position: absolute;
				inset: auto 0 0;
				height: 44px;
				border-top: 6px solid #5fa03a;
				background: #6b5645 url("../public/decor/dirt.png") 0 0 / 44px;
				background-blend-mode: multiply;
			}
			.logo {
				position: absolute;
				left: 56px;
				top: 34px;
				width: 400px;
			}
			.panel {
				position: absolute;
				left: 56px;
				right: 56px;
				top: 230px;
				bottom: 0;
				padding: 44px 52px;
				background: #e6eff4;
				border-top: 8px solid #b4bec3;
				border-left: 8px solid #525252;
				clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
			}
			h1 {
				font-family: "Linux Libertine", Georgia, "Times New Roman", serif;
				font-weight: 400;
				font-size: 60px;
				line-height: 1.1;
				padding-bottom: 14px;
				border-bottom: 2px solid #a2a9b1;
			}
			p {
				margin-top: 20px;
				font-size: 28px;
				line-height: 1.35;
				color: #54595d;
			}
			.tools {
				position: absolute;
				left: 52px;
				bottom: 44px;
				display: flex;
				gap: 14px;
			}
			.tools img {
				width: 78px;
				height: 78px;
				padding: 9px;
				background: #ebebeb;
				border: 3px solid rgb(0 0 0 / 0.4);
				box-shadow: inset 0 -5px 0 rgb(0 0 0 / 0.16);
			}
		</style>
	</head>
	<body>
		<div class="sky"><div class="ground"></div></div>
		<img class="logo" src="../public/minecraft_tools.webp" alt="" />
		<div class="panel">
			<h1>Useful tools for Minecraft</h1>
			<p>Seed map, villager trades, enchanting, banners, armor trims and more.</p>
			<div class="tools">
				<img src="../public/tools/seed-map.png" alt="" />
				<img src="../public/tools/villager-trading.png" alt="" />
				<img src="../public/tools/enchant-order.png" alt="" />
				<img src="../public/tools/banner-generator.png" alt="" />
				<img src="../public/tools/3d-armor-trim-viewer.png" alt="" />
				<img src="../public/tools/potion-maker.png" alt="" />
				<img src="../public/tools/firework-generator.png" alt="" />
				<img src="../public/tools/item-checklist.png" alt="" />
				<img src="../public/tools/stack-calculator.png" alt="" />
				<img src="../public/tools/circle-generator.png" alt="" />
			</div>
		</div>
	</body>
</html>
