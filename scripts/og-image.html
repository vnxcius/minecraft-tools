<!doctype html>
<!--
  Source of public/og.png (1200x630, the image link previews show).
  Render it with any browser at that window size, e.g.
    msedge --headless --allow-file-access-from-files --window-size=1200,630 --screenshot=public/og.png scripts/og-image.html
-->
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: "Mojangles";
				src: url("../src/assets/fonts/Minecraft-Seven_v2.woff2") format("woff2");
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
				position: relative;
				background: #1e1e1c;
				color: #ececea;
				font-family: "Mojangles", monospace;
			}
			.stone {
				position: absolute;
				inset: 0;
				opacity: 0.09;
				image-rendering: pixelated;
				background: url("../public/decor/stone.png") 0 0 / 96px;
				mask-image: linear-gradient(to bottom, black, transparent 85%);
			}
			.ground {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 0;
				height: 96px;
				border-top: 10px solid #5fa03a;
				background: #5b4a3d url("../public/decor/dirt.png") 0 0 / 96px;
				background-blend-mode: multiply;
				image-rendering: pixelated;
			}
			.brand {
				position: absolute;
				left: 80px;
				top: 64px;
				display: flex;
				align-items: center;
				gap: 20px;
				font-size: 40px;
			}
			.brand img {
				width: 56px;
				filter: invert(1);
			}
			h1 {
				position: absolute;
				left: 80px;
				top: 160px;
				width: 720px;
				font-size: 92px;
				line-height: 1.05;
				color: #6cc349;
				font-weight: 400;
			}
			p {
				position: absolute;
				left: 80px;
				top: 410px;
				width: 720px;
				font-size: 28px;
				line-height: 1.35;
				color: #aeaaa2;
			}
			.icons {
				position: absolute;
				right: 70px;
				top: 130px;
				width: 300px;
				display: grid;
				grid-template-columns: repeat(2, 130px);
				gap: 30px;
			}
			.icons img {
				width: 130px;
				image-rendering: pixelated;
				filter: drop-shadow(0 8px 0 rgb(0 0 0 / 0.35));
			}
		</style>
	</head>
	<body>
		<div class="stone"></div>
		<div class="brand"><img src="../public/logo.svg" alt="" />Minecraft Tools</div>
		<h1>Useful tools for Minecraft</h1>
		<p>Stacks, banners, armor trims, potions, fireworks, enchantments and a seed map.</p>
		<div class="icons">
			<img src="../public/shulker_box.webp" alt="" />
			<img src="../public/chest.webp" alt="" />
			<img src="../public/spruce_planks_stack.webp" alt="" />
			<img src="../public/stack_calculator_icon.webp" alt="" />
		</div>
		<div class="ground"></div>
	</body>
</html>
